<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f1eb">
  <title>Roll For It</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f2f1eb;
      --ink: #171815;
      --muted: #72736d;
      --line: #d7d7cf;
      --panel: #20231f;
      --white: #fbfbf7;
      --common: #a4a8a2;
      --uncommon: #44a76b;
      --rare: #4386dc;
      --epic: #a36be3;
      --legendary: #e5bd37;
      --mythical: #e4554f;
      --ascended: #ec77b2;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    button { font: inherit; }

    .shell {
      width: min(1120px, calc(100% - 48px));
      margin: 0 auto;
    }

    .topbar {
      height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      background: var(--ink);
      color: var(--paper);
      font-family: Georgia, serif;
      font-size: 20px;
      line-height: 1;
    }

    .session-count {
      color: var(--muted);
      font-family: "Courier New", monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .06em;
    }

    main { padding: 48px 0 64px; }

    .intro {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 26px;
    }

    .eyebrow {
      margin: 0 0 9px;
      color: var(--muted);
      font-family: "Courier New", monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(42px, 6vw, 66px);
      font-weight: 500;
      letter-spacing: -.045em;
      line-height: .96;
    }

    .intro-note {
      max-width: 220px;
      margin: 0 0 3px;
      color: var(--muted);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 16px;
      line-height: 1.4;
      text-align: right;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 286px;
      align-items: start;
      gap: 32px;
    }

    .arena {
      position: relative;
      display: flex;
      min-height: 474px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 42px 28px 34px;
      background-color: var(--panel);
      background-image: repeating-linear-gradient(135deg, transparent 0 31px, rgb(255 255 255 / 3%) 31px 32px);
      color: var(--white);
      text-align: center;
    }

    .arena::before,
    .arena::after {
      position: absolute;
      width: 230px;
      height: 230px;
      border: 1px solid rgb(255 255 255 / 8%);
      content: "";
      pointer-events: none;
      transform: rotate(45deg);
    }

    .arena::before { top: -167px; left: -101px; }
    .arena::after { right: -152px; bottom: -180px; width: 300px; height: 300px; }

    .result-label {
      position: relative;
      z-index: 1;
      min-height: 17px;
      margin: 0 0 10px;
      color: #b7bab1;
      font-family: "Courier New", monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .result-tier {
      position: relative;
      z-index: 1;
      min-height: 53px;
      margin: 0;
      color: #d1d2cc;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 5vw, 51px);
      font-weight: 500;
      letter-spacing: -.035em;
      line-height: 1.05;
    }

    .result-number {
      position: relative;
      z-index: 1;
      display: grid;
      min-width: 148px;
      height: 148px;
      place-items: center;
      margin: 23px 0 25px;
      border: 1px solid rgb(255 255 255 / 24%);
      color: var(--white);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 82px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      transition: border-color .25s, color .25s, transform .25s;
    }

    .result-number.is-hidden { color: transparent; }
    .result-number.pop { animation: number-pop .35s cubic-bezier(.2, .8, .2, 1); }
    .arena.is-rolling .result-number {
      animation: number-jitter .14s steps(2, end) infinite;
      background: radial-gradient(circle, rgb(245 201 73 / 16%), transparent 72%);
      box-shadow: 0 0 34px rgb(245 201 73 / 24%), inset 0 0 22px rgb(245 201 73 / 12%);
    }

    @keyframes number-jitter {
      0% { transform: translate(-3px, -2px) rotate(-2deg) scale(1.03); }
      50% { transform: translate(3px, 2px) rotate(2deg) scale(.98); }
      100% { transform: translate(-2px, 1px) rotate(-1deg) scale(1.02); }
    }

    @keyframes number-pop {
      0% { opacity: .3; transform: scale(.82) rotate(-5deg); }
      100% { opacity: 1; transform: scale(1) rotate(0); }
    }

    .roll-button {
      position: relative;
      z-index: 1;
      display: inline-flex;
      min-width: 188px;
      min-height: 52px;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border: 0;
      padding: 0 22px;
      background: #d3f06a;
      color: #20231f;
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
      transition: background .18s, transform .18s;
    }

    .roll-button:hover:not(:disabled) { background: #e0ff7c; transform: translateY(-2px); }
    .roll-button:active:not(:disabled) { transform: translateY(0); }
    .roll-button:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    .roll-button:disabled { cursor: wait; opacity: .8; }

    .roll-icon {
      display: grid;
      width: 21px;
      height: 21px;
      place-items: center;
      border: 1.5px solid currentColor;
      border-radius: 50%;
      font-size: 14px;
      line-height: 1;
    }

    .sidebar { display: flex; flex-direction: column; gap: 30px; }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .stat { padding: 16px 10px 17px 0; }
    .stat + .stat { border-left: 1px solid var(--line); padding-left: 17px; }
    .stat-label { display: block; margin-bottom: 8px; color: var(--muted); font-family: "Courier New", monospace; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .stat-value { display: block; font-family: Georgia, "Times New Roman", serif; font-size: 30px; font-variant-numeric: tabular-nums; line-height: 1; }

    .side-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin: 0 0 13px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      font-weight: 500;
    }

    .side-heading small { color: var(--muted); font-family: "Courier New", monospace; font-size: 10px; font-weight: 400; }

    .history-list { min-height: 46px; border-top: 1px solid var(--line); }

    .history-empty { margin: 14px 0; color: var(--muted); font-family: Georgia, "Times New Roman", serif; font-size: 15px; font-style: italic; }

    .history-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 12px;
      min-height: 43px;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
    }

    .history-tier { display: flex; align-items: center; gap: 8px; font-weight: 700; }
    .tier-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tier-color); }
    .history-number { font-family: "Courier New", monospace; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .history-index { color: var(--muted); font-family: "Courier New", monospace; font-size: 10px; }

    .odds-list { border-top: 1px solid var(--line); }
    .odds-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      min-height: 33px;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
    }
    .odds-name { display: flex; align-items: center; gap: 8px; }
    .odds-range { color: var(--muted); font-family: "Courier New", monospace; font-size: 11px; }
    .odds-chance { min-width: 7ch; color: var(--ink); font-family: "Courier New", monospace; font-size: 11px; text-align: right; }

    .rainbow {
      color: transparent;
      background-image: linear-gradient(90deg, #f46654, #f5c949, #87cf68, #5bc4d1, #8b73d9, #e678bd);
      background-clip: text;
      -webkit-background-clip: text;
    }

    .cutscene {
      position: fixed;
      z-index: 5;
      inset: 0;
      display: grid;
      overflow: hidden;
      place-items: center;
      background-color: #171815;
      background-image: repeating-linear-gradient(135deg, transparent 0 25px, rgb(255 255 255 / 5%) 25px 26px);
      color: #fbfbf7;
      text-align: center;
    }

    .cutscene[hidden] { display: none; }
    .cutscene.is-open { animation: cutscene-enter .45s cubic-bezier(.16, 1, .3, 1) both; }

    @keyframes cutscene-enter {
      from { opacity: 0; transform: scale(1.08); }
      to { opacity: 1; transform: scale(1); }
    }

    .cutscene-content { position: relative; z-index: 1; padding: 32px 22px; }
    .cutscene-kicker { margin: 0 0 18px; color: #d3f06a; font-family: "Courier New", monospace; font-size: 12px; font-weight: 700; letter-spacing: .2em; }
    .cutscene-title { margin: 0; color: var(--cutscene-accent, #e4554f); font-family: Georgia, "Times New Roman", serif; font-size: clamp(56px, 13vw, 132px); font-weight: 500; letter-spacing: -.05em; line-height: .9; animation: title-slam .55s cubic-bezier(.16, 1, .3, 1) both; }
    .cutscene-title.rainbow { color: transparent; }

    @keyframes title-slam {
      from { opacity: 0; transform: scale(1.35) rotate(-4deg); }
      to { opacity: 1; transform: scale(1) rotate(0); }
    }

    .cutscene-number { margin: 20px 0 28px; color: #fbfbf7; font-family: "Courier New", monospace; font-size: clamp(20px, 4vw, 30px); font-weight: 700; letter-spacing: .1em; }
    .cutscene-button { min-width: 150px; min-height: 48px; border: 0; padding: 0 20px; background: #d3f06a; color: #20231f; cursor: pointer; font-size: 13px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; }
    .cutscene-button:focus-visible { outline: 3px solid white; outline-offset: 4px; }

    .confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .confetti i { position: absolute; top: -12%; left: var(--x); width: 9px; height: 18px; background: var(--confetti-color); animation: confetti-fall var(--fall-time) cubic-bezier(.3, .1, .7, .9) var(--delay) infinite; }
    .confetti i:nth-child(3n) { width: 7px; height: 7px; border-radius: 50%; }

    @keyframes confetti-fall {
      0% { opacity: 0; transform: translate3d(0, -5vh, 0) rotate(0); }
      15% { opacity: 1; }
      100% { opacity: .8; transform: translate3d(var(--drift), 115vh, 0) rotate(720deg); }
    }

    @media (max-width: 760px) {
      .shell { width: min(100% - 32px, 540px); }
      main { padding-top: 34px; }
      .intro { align-items: start; flex-direction: column; gap: 13px; }
      .intro-note { max-width: none; text-align: left; }
      .layout { grid-template-columns: 1fr; gap: 28px; }
      .arena { min-height: 430px; }
      .sidebar { display: grid; grid-template-columns: 1fr 1fr; align-items: start; column-gap: 22px; row-gap: 25px; }
      .stats { grid-column: 1 / -1; }
      .history-section { grid-column: 1 / -1; }
    }

    @media (max-width: 420px) {
      .shell { width: calc(100% - 28px); }
      .topbar { height: 62px; }
      .session-count { font-size: 10px; }
      .arena { min-height: 405px; padding-inline: 16px; }
      .result-number { min-width: 132px; height: 132px; font-size: 74px; }
      .sidebar { grid-template-columns: 1fr; }
      .stats, .history-section { grid-column: auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">R</span><span>Roll for it</span></div>
      <div class="session-count" aria-live="polite">ROLLS <span id="roll-count">00</span></div>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">A little luck goes a long way</p>
          <h1 id="page-title">Roll for it.</h1>
        </div>
        <p class="intro-note">One roll. One rarity. What did luck deal you?</p>
      </section>

      <div class="layout">
        <section class="arena" aria-label="Roll result">
          <p class="result-label" id="result-label" aria-live="polite">Your next result</p>
          <h2 class="result-tier" id="result-tier">Ready?</h2>
          <div class="result-number is-hidden" id="result-number" aria-live="polite" aria-label="No number rolled yet">?</div>
          <button class="roll-button" id="roll-button" type="button">
            <span class="roll-icon" aria-hidden="true">↻</span>
            <span id="button-label">Roll the dice</span>
          </button>
        </section>

        <aside class="sidebar" aria-label="Roll stats and rarity ranges">
          <section class="stats" aria-label="Session statistics">
            <div class="stat"><span class="stat-label">Your rolls</span><strong class="stat-value" id="stat-rolls">0</strong></div>
            <div class="stat"><span class="stat-label">Best roll</span><strong class="stat-value" id="stat-best">--</strong></div>
          </section>

          <section class="history-section" aria-labelledby="history-title">
            <h2 class="side-heading" id="history-title">Recent <small>LAST 5</small></h2>
            <div class="history-list" id="history-list" aria-live="polite">
              <p class="history-empty">Your rolls will show up here.</p>
            </div>
          </section>

          <section aria-labelledby="odds-title">
            <h2 class="side-heading" id="odds-title">The odds</h2>
            <div class="odds-list" id="odds-list"></div>
          </section>
        </aside>
      </div>
    </main>
  </div>

  <section class="cutscene" id="cutscene" role="dialog" aria-modal="true" aria-labelledby="cutscene-title" hidden>
    <div class="confetti" aria-hidden="true">
      <i style="--x: 7%; --drift: 12vw; --delay: -.3s; --fall-time: 3.2s; --confetti-color: #e4554f"></i>
      <i style="--x: 16%; --drift: -8vw; --delay: -1.6s; --fall-time: 4s; --confetti-color: #e5bd37"></i>
      <i style="--x: 27%; --drift: 10vw; --delay: -.8s; --fall-time: 3.6s; --confetti-color: #44a76b"></i>
      <i style="--x: 38%; --drift: -11vw; --delay: -2.3s; --fall-time: 4.2s; --confetti-color: #4386dc"></i>
      <i style="--x: 49%; --drift: 8vw; --delay: -1.1s; --fall-time: 3.5s; --confetti-color: #a36be3"></i>
      <i style="--x: 60%; --drift: -9vw; --delay: -2.7s; --fall-time: 4.4s; --confetti-color: #ec77b2"></i>
      <i style="--x: 71%; --drift: 11vw; --delay: -.5s; --fall-time: 3.8s; --confetti-color: #e5bd37"></i>
      <i style="--x: 82%; --drift: -10vw; --delay: -1.9s; --fall-time: 4.1s; --confetti-color: #44a76b"></i>
      <i style="--x: 93%; --drift: 7vw; --delay: -1.3s; --fall-time: 3.3s; --confetti-color: #4386dc"></i>
    </div>
    <div class="cutscene-content">
      <p class="cutscene-kicker">THE UNIVERSE HAS CHOSEN</p>
      <h2 class="cutscene-title" id="cutscene-title">MYTHICAL!</h2>
      <p class="cutscene-number" id="cutscene-number">ROLL 30</p>
      <button class="cutscene-button" id="cutscene-continue" type="button">Continue</button>
    </div>
  </section>

  <script>
    const rarities = [
      { name: "Common", min: 1, max: 5, weight: 50, color: "var(--common)" },
      { name: "Uncommon", min: 6, max: 10, weight: 25, color: "var(--uncommon)" },
      { name: "Rare", min: 11, max: 13, weight: 12.5, color: "var(--rare)" },
      { name: "Epic", min: 14, max: 20, weight: 6.25, color: "var(--epic)" },
      { name: "Legendary", min: 21, max: 25, weight: 4.125, color: "var(--legendary)" },
      { name: "Mythical", min: 26, max: 30, weight: 3.5625, color: "var(--mythical)" },
      { name: "Ascended", min: 31, max: 39, weight: 2.5, color: "var(--ascended)" },
      { name: "Jackpot", min: 40, max: 40, weight: 0.0625, color: "rainbow" }
    ];
    const totalWeight = rarities.reduce((total, rarity) => total + rarity.weight, 0);

    const rollButton = document.querySelector("#roll-button");
    const resultLabel = document.querySelector("#result-label");
    const resultTier = document.querySelector("#result-tier");
    const resultNumber = document.querySelector("#result-number");
    const buttonLabel = document.querySelector("#button-label");
    const historyList = document.querySelector("#history-list");
    const arena = document.querySelector(".arena");
    const cutscene = document.querySelector("#cutscene");
    const cutsceneTitle = document.querySelector("#cutscene-title");
    const cutsceneNumber = document.querySelector("#cutscene-number");
    const cutsceneContinue = document.querySelector("#cutscene-continue");
    const history = [];
    let rolls = 0;
    let best = 0;

    function renderOdds() {
      document.querySelector("#odds-list").innerHTML = rarities.map((rarity) => `
        <div class="odds-row">
          <span class="odds-name"><span class="tier-dot" style="--tier-color: ${rarity.color}; background: ${rarity.name === "Jackpot" ? "linear-gradient(90deg, #f46654, #f5c949, #87cf68, #5bc4d1, #8b73d9, #e678bd)" : rarity.color}"></span>${rarity.name}</span>
          <span class="odds-range">${rarity.min === rarity.max ? rarity.min : `${rarity.min}–${rarity.max}`}</span>
          <span class="odds-chance">${(rarity.weight / totalWeight * 100).toFixed(4)}%</span>
        </div>
      `).join("");
    }

    function selectRarity() {
      let ticket = Math.random() * totalWeight;
      for (const rarity of rarities) {
        ticket -= rarity.weight;
        if (ticket < 0) return rarity;
      }
      return rarities[rarities.length - 1];
    }

    function renderHistory() {
      if (history.length === 0) {
        historyList.innerHTML = '<p class="history-empty">Your rolls will show up here.</p>';
        return;
      }

      historyList.innerHTML = history.map((entry, index) => `
        <div class="history-row">
          <span class="history-tier"><span class="tier-dot" style="--tier-color: ${entry.rarity.color}; background: ${entry.rarity.name === "Jackpot" ? "linear-gradient(90deg, #f46654, #f5c949, #87cf68, #5bc4d1, #8b73d9, #e678bd)" : entry.rarity.color}"></span>${entry.rarity.name}</span>
          <span class="history-number">${entry.number}</span>
          <span class="history-index">#${String(rolls - index).padStart(2, "0")}</span>
        </div>
      `).join("");
    }

    function closeCutscene() {
      cutscene.hidden = true;
      cutscene.classList.remove("is-open");
      rollButton.disabled = false;
      rollButton.focus();
    }

    function showCutscene(rarity, number) {
      cutsceneTitle.textContent = rarity.name === "Jackpot" ? "JACKPOT!" : `${rarity.name.toUpperCase()}!`;
      cutsceneTitle.classList.toggle("rainbow", rarity.name === "Jackpot");
      cutscene.style.setProperty("--cutscene-accent", rarity.name === "Jackpot" ? "#f5c949" : rarity.color);
      cutsceneNumber.textContent = `ROLL ${number}`;
      cutscene.hidden = false;
      cutscene.classList.add("is-open");
      cutsceneContinue.focus();
    }

    function roll() {
      if (rollButton.disabled) return;

      rollButton.disabled = true;
      arena.classList.add("is-rolling");
      resultLabel.textContent = "Rolling...";
      resultTier.textContent = "The fates decide";
      resultTier.style.color = "#d1d2cc";
      resultNumber.setAttribute("aria-live", "off");
      resultNumber.classList.add("is-hidden");
      resultNumber.classList.remove("pop");
      buttonLabel.textContent = "Rolling...";

      const rarity = selectRarity();
      const number = Math.floor(Math.random() * (rarity.max - rarity.min + 1)) + rarity.min;

      window.setTimeout(() => {
        resultLabel.textContent = "Your rarity";
        resultTier.textContent = rarity.name;
        resultTier.className = `result-tier ${rarity.name === "Jackpot" ? "rainbow" : ""}`;
        resultTier.style.color = rarity.name === "Jackpot" ? "transparent" : rarity.color;

        resultLabel.textContent = "Number incoming";
        resultNumber.classList.remove("is-hidden");
        resultNumber.style.color = "#f5c949";
        resultNumber.style.borderColor = "#f5c949";
        let animationStep = 0;
        const animationSteps = 18;
        const animateReel = () => {
          animationStep += 1;
          const nearMiss = animationStep >= animationSteps - 2;
          resultNumber.textContent = nearMiss ? "39" : String(Math.floor(Math.random() * 40) + 1);
          resultLabel.textContent = nearMiss ? "SO CLOSE..." : "Rolling...";

          if (animationStep < animationSteps) {
            const progress = animationStep / animationSteps;
            window.setTimeout(animateReel, 35 + Math.floor(progress ** 4 * 280));
            return;
          }

          resultLabel.textContent = "And the result is...";
          window.setTimeout(() => {
            arena.classList.remove("is-rolling");
            rolls += 1;
            best = Math.max(best, number);
            history.unshift({ number, rarity });
            history.length = Math.min(history.length, 5);

            resultLabel.textContent = "Your number";
            resultNumber.setAttribute("aria-live", "polite");
            resultNumber.textContent = number;
            resultNumber.setAttribute("aria-label", `Your number is ${number}`);
            resultNumber.classList.remove("is-hidden");
            if (rarity.name === "Jackpot") resultNumber.classList.add("rainbow");
            else resultNumber.classList.remove("rainbow");
            resultNumber.style.borderColor = rarity.name === "Jackpot" ? "#e678bd" : rarity.color;
            resultNumber.style.color = rarity.name === "Jackpot" ? "transparent" : rarity.color;
            void resultNumber.offsetWidth;
            resultNumber.classList.add("pop");
            buttonLabel.textContent = "Roll again";
            rollButton.disabled = false;

            document.querySelector("#roll-count").textContent = String(rolls).padStart(2, "0");
            document.querySelector("#stat-rolls").textContent = rolls;
            document.querySelector("#stat-best").textContent = best;
            renderHistory();
            if (rarity.min >= 26) showCutscene(rarity, number);
            else rollButton.disabled = false;
          }, 260);
        };
        window.setTimeout(animateReel, 35);
      }, 700);
    }

    renderOdds();
    rollButton.addEventListener("click", roll);
    cutsceneContinue.addEventListener("click", closeCutscene);
    cutscene.addEventListener("click", (event) => {
      if (event.target === cutscene) closeCutscene();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !cutscene.hidden) closeCutscene();
    });
  </script>
</body>
</html>
